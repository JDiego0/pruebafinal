server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: riwi-messaging
  flyway:
    enabled: false # migrations run via the dedicated `migrate` service as rw_migrator (D-07)
  jackson:
    default-property-inclusion: non_null

app:
  datasource:
    jdbc-url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bd_juandiego_garcia_nakamoto}
    app-user: ${RW_APP_USER:rw_app}
    app-password: ${RW_APP_PASSWORD:}
    migrator-user: ${RW_MIGRATOR_USER:rw_migrator}
    migrator-password: ${RW_MIGRATOR_PASSWORD:}

  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:riwi-messaging}
    audience: ${JWT_AUDIENCE:riwi-messaging-web}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:1209600}

  cookie:
    secure: ${COOKIE_SECURE:false}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

  seed:
    file: ${SEED_FILE:../database/seeds/seed.json}

  ai:
    enabled: ${AI_ENABLED:false}
    provider-code: ${AI_PROVIDER_CODE:groq}
    base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
    model: ${AI_MODEL:llama-3.3-70b-versatile}
    api-key: ${AI_API_KEY:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}

  embedding:
    provider-code: ${EMBEDDING_PROVIDER_CODE:local}
    base-url: ${EMBEDDING_BASE_URL:}
    model: ${EMBEDDING_MODEL:}
    api-key: ${EMBEDDING_API_KEY:}
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:30}
    batch-size: ${EMBEDDING_BATCH_SIZE:32}
    worker-delay-ms: ${EMBEDDING_WORKER_DELAY_MS:5000}
    # Must match a rw_embedding_models.rw_model_code row; the worker stamps this
    # code on every vector it writes.
    model-code: ${EMBEDDING_MODEL_CODE:deterministic-1536}

  rag:
    candidate-limit: ${RAG_CANDIDATE_LIMIT:12}
    similarity-floor: ${RAG_SIMILARITY_FLOOR:0.25}
    max-context-chars: ${RAG_MAX_CONTEXT_CHARS:6000}

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId}] %logger{36} - %msg%n"
