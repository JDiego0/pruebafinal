services:
  db:
    image: pgvector/pgvector:pg16
    container_name: riwi-messaging-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bd_juandiego_garcia_nakamoto}
      rwMigratorPassword: ${RW_MIGRATOR_PASSWORD:-mig_pass}
      rwAppPassword: ${RW_APP_PASSWORD:-app_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-bd_juandiego_garcia_nakamoto}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: flyway/flyway:10.15
    container_name: riwi-messaging-migrate
    depends_on:
      db:
        condition: service_healthy
    command: -url=jdbc:postgresql://db:5432/${POSTGRES_DB:-bd_juandiego_garcia_nakamoto} -user=postgres -password=${POSTGRES_PASSWORD:-postgres} -placeholders.rwMigratorPassword=${RW_MIGRATOR_PASSWORD:-mig_pass} -placeholders.rwAppPassword=${RW_APP_PASSWORD:-app_pass} migrate
    volumes:
      - ./database/migrations:/flyway/sql

  backend:
    build:
      context: ./backend
    container_name: riwi-messaging-backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-bd_juandiego_garcia_nakamoto}
      - RW_APP_USER=rw_app
      - RW_APP_PASSWORD=${RW_APP_PASSWORD:-app_pass}
      - RW_MIGRATOR_USER=rw_migrator
      - RW_MIGRATOR_PASSWORD=${RW_MIGRATOR_PASSWORD:-mig_pass}
      - JWT_SECRET=${JWT_SECRET:-dGhpcy1pcy1hLWR1bW15LXNlY3JldC1rZXktdGhhdC1pcy1hdC1sZWFzdC0yNTYtYml0cy1sb25n}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_PROVIDER_CODE=${AI_PROVIDER_CODE:-groq}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.groq.com/openai/v1}
      - AI_MODEL=${AI_MODEL:-llama-3.3-70b-versatile}
      - AI_API_KEY=${AI_API_KEY:-}
      - EMBEDDING_PROVIDER_CODE=${EMBEDDING_PROVIDER_CODE:-local}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: riwi-messaging-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
