services:
  db:
    image: pgvector/pgvector:pg16
    container_name: riwi-messaging-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bd_juandiego_garcia_nakamoto}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bd_juandiego_garcia_nakamoto}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applies database/migrations as the bootstrap superuser, which is the only
  # role permitted to CREATE ROLE. Exits when the schema is at the latest
  # version; every other service waits for that exit.
  migrate:
    image: flyway/flyway:10.15
    container_name: riwi-messaging-migrate
    depends_on:
      db:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://db:5432/${POSTGRES_DB:-bd_juandiego_garcia_nakamoto}
      -user=${POSTGRES_USER:-postgres}
      -password=${POSTGRES_PASSWORD:-postgres}
      -placeholders.rwMigratorPassword=${RW_MIGRATOR_PASSWORD:-mig_pass}
      -placeholders.rwAppPassword=${RW_APP_PASSWORD:-app_pass}
      -connectRetries=10
      migrate
    volumes:
      - ./database/migrations:/flyway/sql:ro

  # One-shot corpus loader. Same image as the backend, started with the `seed`
  # profile, connecting as rw_migrator (the running backend never can).
  # Idempotent: re-running it against a seeded database inserts nothing.
  seed:
    build:
      context: ./backend
    container_name: riwi-messaging-seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bd_juandiego_garcia_nakamoto}
      RW_APP_USER: rw_app
      RW_APP_PASSWORD: ${RW_APP_PASSWORD:-app_pass}
      RW_MIGRATOR_USER: rw_migrator
      RW_MIGRATOR_PASSWORD: ${RW_MIGRATOR_PASSWORD:-mig_pass}
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LXJlcGxhY2UtbWUtaW4tZXZlcnktcmVhbC1lbnZpcm9ubWVudA==}
      SEED_FILE: /seed/seed.json
      SPRING_PROFILES_ACTIVE: seed
    volumes:
      - ./database/seeds:/seed:ro
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: riwi-messaging-backend
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bd_juandiego_garcia_nakamoto}
      # The running application connects ONLY as rw_app (NOSUPERUSER, NOBYPASSRLS).
      RW_APP_USER: rw_app
      RW_APP_PASSWORD: ${RW_APP_PASSWORD:-app_pass}
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LXJlcGxhY2UtbWUtaW4tZXZlcnktcmVhbC1lbnZpcm9ubWVudA==}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-1209600}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER_CODE: ${AI_PROVIDER_CODE:-groq}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-120b}
      AI_API_KEY: ${AI_API_KEY:-}
      EMBEDDING_PROVIDER_CODE: ${EMBEDDING_PROVIDER_CODE:-local}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      RAG_CANDIDATE_LIMIT: ${RAG_CANDIDATE_LIMIT:-12}
      RAG_SIMILARITY_FLOOR: ${RAG_SIMILARITY_FLOOR:-0.05}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: riwi-messaging-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  pgdata:
